# Side panel of the "Move Sandbox" folder of side-panel.yaml, included
# there through "include". A resource file (no entry, no part): its items
# and the items written under the folder in side-panel.yaml belong to
# the same scope, so in edit mode they move freely between the two files.
# Free to change: moving items rewrites this file, in place.
# design: doc_page_impl_side_panel.md#moving-an-item
sidePanelById:
  main:
    tree:
      # written in .doc-page/side-panel-move-sandbox.yaml
      - id: move-included-a
        text: Included A
        doc: ~example/side-panel-move/included-a.md
      - id: move-included-folder
        text: Included Folder
        children:
          - id: move-included-b
            text: Included B
            inline:
              content: An inline page inside a folder of `.doc-page/side-panel-move-sandbox.yaml`.
