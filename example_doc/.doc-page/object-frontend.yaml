# The frontend objects of the demonstration doc page and their types (design:
# main/doc_page_impl_obj_frontend.md). Found here by convention
# (.doc-page/object-frontend.yaml beside the entry); "objectFrontend: { file }"
# of the entry would name another file, "objectFrontend: false" none.
#
# typeList: the types of the doc page's objects. each extends frontend.object
# (directly, or through another type a doc page declares) and inherits the
# modes of its ancestors (frontend.object brings "overview"); a mode declared
# again with the same id replaces the inherited one. a mode is a component
# and the parameters it starts with: two modes may share a component and
# differ by their parameters only (shelf / cards). the components are the doc
# page's own (comp-mdx/object-frontend/reading-list/comp.yaml).
#
# objectList: the objects that exist, by id; each names its entry asset (in
# .doc-page/asset/{id}--{name}/, with the other assets of the object). the
# Frontend objects tab of the settings panel adds and removes these lines.
typeList:
  - id: example.reading-list
    label: Reading list
    description: books (one asset each) and notes on them (one asset each, naming their book)
    icon: book
    modeList:
      - id: shelf
        label: Shelf
        description: the books as a table, filtered by their status
        comp: ReadingList
        param: { layout: table }
        isDefault: true
      - id: cards
        label: Cards
        description: the same books as cards
        comp: ReadingList
        param: { layout: cards }
      - id: add
        label: Add a book
        category: edit
        comp: ReadingListAdd
      - id: book
        label: One book
        description: a book and its notes; param book names it (a path, a key, name:…)
        comp: ReadingListBook
      - id: find
        label: Find
        description: the assets searched by words and browsed by their paths
        comp: ReadingListFind
      - id: stats
        label: Numbers
        comp: ReadingListStats
  # a reading list with fewer things on it: every mode of its parent, its
  # shelf as cards (the inherited mode of the same id is replaced)
  - id: example.reading-list-short
    label: Short reading list
    extendList: [example.reading-list]
    icon: book
    modeList:
      - id: shelf
        label: Shelf
        comp: ReadingList
        param: { layout: cards }
        isDefault: true
objectList:
  - id: w5j7ozoijzl
    entry: w5j7ozokr1x
  - id: w5j7pn0lh5o
    entry: w5j7pn0m41l
