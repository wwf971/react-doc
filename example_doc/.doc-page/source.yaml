# Ordered source rules, named by entry.yaml (source.file). Paths are relative
# to this file, so the doc page folder, example_doc, is "..". The metadata
# files of the doc page (the entry, this file, the side-panel, tag and config
# files) live in .doc-page/, which is never collected, so no rule excludes it.
#
# every add rule declares a root folder of this doc page under an alias, and
# every collected file is named by its source path ~alias/path-in-root
# (design: doc_page_impl_source.md#source-paths). the alias, not the folder
# name, is what documents write: the folder can be renamed, and two folders
# of one name can both be roots. without "alias" the folder name is used;
# two different folders under one alias are an error. inside this doc page
# the local form ~alias/... is enough; from another doc page of the
# workspace the file is ~example:alias/... (the doc page's own alias first).
# an addFolder rule says how it collects (collect):
#   recursive   every file below the folder is a document
#   direct      the files right in the folder are documents
#   referenced  the files are collectable, not documents: they are part of the
#               page only when used (an image an Image block names, a file an
#               asset version depends on)
# a later rule with the alias of a root refines how a folder inside it is
# collected.
rules:
  - action: addFolder
    alias: example              # the folder example_doc, written ~example/...
    path: ..
    collect: recursive
    # what this rule does not collect, written like a .gitignore: patterns
    # over the path from the rule's folder, the last match decides
    # (design: doc_page_impl_source.md#excluding-files-and-folders)
    exclude:
      - "*.pyc"                 # a name: at any depth
      - .DS_Store
      - .gitignore
      # the sub document and the second root doc page declare their own
      # source rules in their entries; a trailing "/": folders only
      - sub-doc/
      - second-doc/
      # no pattern for comp-mdx/ (the components of this doc page) nor for
      # the asset and service folders: the doc page folder convention keeps
      # them out of the source (doc_page_impl_source.md#the-folders-a-doc-page-keeps-out-by-convention)
  - action: addFile
    alias: req                  # the folder main/, written ~req/...
    path: ../../main/doc_page_req.md
    tags: [reference]           # tags every file this rule collects
  # the images of the demonstration: referenced files, bundled into a build
  # only when a document or an asset version uses them
  - action: addFolder
    alias: example
    path: ../mdx-usage/image
    collect: referenced
  # the files the page itself creates: images pasted into Image / ImageGrid
  # (variable imageFileStoreDirDefault of config.yaml in this folder names it)
  - action: addFolder
    alias: example
    path: ../asset-file/image
    collect: referenced
  # tag steps apply to the files collected so far
  - action: addTagByPath
    pattern: "~example/link-nav/**"
    tags: [test]
  - action: addTagByName
    pattern: "*.py"
    tags: [code]
  # collected and tagged, but not bound by any side-panel item: the tag
  # overview lists it last
  - action: addTagByPath
    pattern: "~example/tag-outside-side-panel.md"
    tags: [guide]
  # config steps also apply to the files collected so far (source level of
  # the config system; side-panel items and the frontmatter can override it)
  - action: setConfigByPath
    pattern: "~example/doc-config.md"
    config:
      TagsDisplayAtLinkIsOn: true
