  - { id: dev, name: Developer, width: 6.5rem }
  - { id: pm, name: PM, width: 6.5rem }
rows:
  - id: form
    label: Login form
    children:
      - id: form-empty
        label: Empty submit
        cells:
          description: Submit the form with both fields empty.
      - id: form-wrong
        label: Wrong password
        cells:
          description: Submit a known address with a wrong password.
      - id: form-ok
        label: Valid credentials
        cells:
          description: Submit a known address with its password.
  - id: session
    label: Session
    children:
      - id: session-expire
        label: Expiry
        cells:
          description: Wait past the session lifetime, then open a page.
      - id: session-logout
        label: Logout
        cells:
          description: Choose Logout in the account menu.
