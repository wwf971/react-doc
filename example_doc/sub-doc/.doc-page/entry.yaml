# Entry of a self-contained sub document, a doc page of its own: the folder
# sub-doc/ with its metadata in sub-doc/.doc-page/. Everything about it is
# declared in this file: its source (the folder, as the root "sub-doc"), its
# tag, its config, and its side panel. The side panels of the demonstration
# page include it by its folder under the alias "sub"
# (include: { dir: ../sub-doc, alias: sub }), which brings these source
# rules, tag definitions and config into the page as well; from there its
# files are ~sub:sub-doc/... . A workspace file can name the folder as a
# root doc page instead, and the sub document deploys on its own.
docEntry:
  title: Sub Document
  homeDoc: ~sub-doc/sub-doc.md

source:
  - action: addFolder
    alias: sub-doc               # written ~sub-doc/... inside this doc page
    path: ..
    collect: recursive

tag:
  defineById:
    sub:
      text: Sub
      display:
        data: { colorBorder: '#0f766e', colorBackground: '#ccfbf1', colorText: '#115e59' }

# config of this doc page. it is applied when this doc page is the main
# doc page of the workspace (deployed alone, or first in a workspace file);
# included by another doc page, as here, it is shown on a tab of its own in
# the settings panel and not applied: the main doc page and the workspace
# decide the page config (doc_page_impl_config.md#the-doc-page-layers).
config:
  TagsDisplayAtLinkIsOn: false
  TagsDisplayAtLinkPosition: before

# one side panel, so it is the default without "sidePanelDefault"
sidePanelById:
  main:
    # properties of the node that includes this side panel: in the page side
    # panel it is a folder bound to the overview, labeled and tagged from here
    root:
      doc: ~sub-doc/sub-doc.md
      text: Sub Document
      tags: [sub]
      defaultOpen: true
    tree:
      - doc: ~sub-doc/entry-format.md
      - doc: ~sub-doc/including.md
      - doc: ~sub-doc/workspace.md
      # a third notes.md of the workspace (link-nav/ has two): from a
      # document of this doc page, "notes.md" means this one
      - doc: notes.md
        text: Notes (sub document)
