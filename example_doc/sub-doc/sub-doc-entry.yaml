# Entry of a self-contained sub document. Everything about it is declared in
# this file: its source (this folder, as the root "sub-doc"), its tag, and its
# side panel. ../side-panel.yaml and ../example-entry.yaml include the side
# panel through "include", which brings these source rules and tag definitions
# into the page as well. config.yaml can name this file as docEntry.file
# instead, and the sub document deploys on its own.
docEntry:
  title: Sub Document
  homeDoc: ~sub-doc/sub-doc.md

source:
  - action: addFolder
    rootId: sub-doc
    path: .
    collect: recursive

tag:
  defineById:
    sub:
      text: Sub
      display:
        data: { colorBorder: '#0f766e', colorBackground: '#ccfbf1', colorText: '#115e59' }

# one side panel, so it is the default without "sidePanelDefault"
sidePanelById:
  main:
    # properties of the node that includes this side panel: in the page side
    # panel it is a folder bound to the overview, labeled and tagged from here
    root:
      doc: ~sub-doc/sub-doc.md
      text: Sub Document
      tags: [sub]
      defaultOpen: true
    tree:
      - doc: ~sub-doc/entry-format.md
      - doc: ~sub-doc/including.md
