# the service backend of the example doc (doc_page_impl_service_instance.md#backend-config)
#   python3 main/service-backend/server.py --config example_doc/service-backend.yaml
host: 127.0.0.1
port: 45190
# how long a sync api call is waited for, queue included, before -6
apiWaitSecondMax: 120
# folders holding the service types: {typeId}/service_type.py
typeFolderList:
  - path: ./service-type
# folders holding the service instances: {serviceId}--{name}/service.yaml.
# a new instance is created in the default one
instanceFolderList:
  - path: ./service
    isDefault: true
