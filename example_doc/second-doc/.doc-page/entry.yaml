# Entry of the second root-level doc page of the demonstration workspace
# (.doc-workspace/workspace.yaml at the project root lists it beside "example"). With two
# root doc pages the page side panel shows one section per doc page: its
# alias as a muted heading, its own side panel below. A self-contained doc
# page like the sub document; the demonstration doc page does not include
# it, and its folder is excluded from the root "example"
# (example_doc/.doc-page/source.yaml, exclude: second-doc/).
docEntry:
  title: Second Doc Page
  homeDoc: ~second-doc/second-doc.md

source:
  - action: addFolder
    alias: second-doc            # written ~second-doc/... inside this doc page
    path: ..
    collect: recursive

# the side panel is one root item holding the rest, as the side panel of a
# doc page often is, and the root is bound to a document. a mount unfolds
# such a sole root by default (the workspace mount option isRootUnfolded):
# the root is drawn as a marked root row opening its document, and its
# children directly under the section heading "second", not one level
# down (the root keeps its id, tags and part). the Workspace tab toggles
# it per mount ("unfold")
sidePanelById:
  main:
    tree:
      - id: second-root
        text: Second Doc Page
        doc: ~second-doc/second-doc.md
        children:
          - doc: ~second-doc/workspace-edit.md
            text: Editing the Workspace
