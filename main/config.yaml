# doc system config (example layer; local overrides go to config.0.yaml)

# the doc page this page shows, by its folder: the entry is found in its
# .doc-page/ folder (.doc-page/entry.yaml), which declares the source rules,
# the tag definitions, the config and the side panels of the document.
# "file: <entry file>" names the entry itself instead. "sidePanel" names one
# of its side panels instead of its default.
# design: doc_page_impl_dir.md, doc_page_impl_side_panel.md#the-document-entry
docEntry:
  dir: ../example_doc
  # sidePanel: compact

# page values. when absent, the entry's "docEntry" mapping supplies them
# (title, homeDoc, homeItem), so another document deploys by changing
# docEntry.file alone; the demonstration leaves them to the entry.
# siteTitle: React Doc Test
# homeDoc: ~example/doc.md       # source path: ~{rootId}/relative/path (doc_page_impl_source.md)

# variables: ${name} in any string value of a config declaration (this
# file's configDefault, the doc page config, source rules, side-panel items,
# frontmatter "config") is replaced by the value here. a config file of the
# doc page declares variables of its own, which win over these; the
# demonstration declares its variables there (example_doc/.doc-page/config.yaml).
# design: doc_page_impl_config.md#variables
# variable:
#   name: value

# the asset service layer (versioned objects a component block can reference
# instead of carrying its data inline, ```asset blocks) is configured by each
# doc page, not here: .doc-page/asset.yaml beside its entry names its folders
# (example_doc/.doc-page/asset.yaml); without it a doc page uses the folder
# asset/ of its folder. served through the asset api on the development
# server, bundled as a read-only snapshot into a build.
# design: doc_page_impl_asset.md

# the service instances: stateful services run by the service backend
# (main/service-backend/server.py), a program of its own. the development
# server forwards {base}/__doc-service/* to it; a page without the backend
# shows "backend down" in every dashboard. backendConfigFile names the
# backend's config file: the type and instance folders it lists are not
# documents, and a change in them never reloads the page. a built page has
# no backend. design: doc_page_impl_service.md
service:
  backend: http://127.0.0.1:45190
  backendConfigFile: ../example_doc/.doc-page/service-backend.yaml

# tag definitions of the page (how each tag looks), merged over the ones the
# entry and the documents it includes declare. which assets carry a tag is
# declared in source rules and side-panel nodes. the demonstration declares
# its definitions in the entry (tag.file); page-level entries would go here:
# tag:
#   defineById: { ... }
# design: doc_page_impl_tag.md

# the default config layer: the values of the config keys this package
# provides, over the built-in defaults of the key definitions. the settings
# panel shows them greyed out and never writes them; a doc page sets its own
# values in the "config" of its entry (the doc page layer, above this one).
# keys of one feature share a prefix. document-level keys can be refined per
# document by source rules, side-panel nodes and frontmatter "config".
# component-level keys (the keys a registered component declares for itself,
# compDefine configDefineList) go under "compConfig", by the component's tag
# name. design: doc_page_impl_config.md#config-layers
configDefault:
  TagsDisplayAtMainPanelIsOn: true          # document level
  TagsDisplayAtSidePanelItemIsOn: true      # page level
  TagsDisplayAtLinkIsOn: false              # document level
  TagsDisplayAtLinkPosition: after          # document level: before | after
  TagsOverviewPopupIsOn: true               # page level
  TagsOverviewPopupAtSidePanelItemIsOn: false   # page level
  compConfig:
    Image:
      PasteReplaceConfirmIsOn: true         # ask before a paste replaces an existing image
    ImageGrid:
      PasteReplaceConfirmIsOn: true

# tag name usable in docs -> component id in comp-doc/registry/registry.js
compRegistry:
  Tabs: common/Tabs
  Tab: common/Tab
  Callout: common/Callout
  Accordions: common/Accordions
  Accordion: common/Accordion
  Steps: common/Steps
  Step: common/Step
  Files: common/Files
  File: common/File
  Folder: common/Folder
  FileTree: common/FileTree
  Index: common/Index
  DocLinkInline: common/DocLinkInline
  MultiLang: common/MultiLang
  Image: common/Image
  ImageGrid: common/ImageGrid
  DiagramText: common/DiagramText
  DiagramMermaid: common/DiagramMermaid
  DiagramER: common/DiagramER
  # asset-only: its data is a workbook in the asset service layer, the block a reference to it
  ExcelUniver: common/ExcelUniver
  Block: common/Block
  BlockSimple: common/BlockSimple
  BlockMdx: common/BlockMdx
  BlockQA: common/BlockQA
  FileDownload: common/FileDownload
  FileIcon: common/FileIcon              # the default icon of FileDownload (placement fileDownloadIcon)
  TableHierarchy: common/TableHierarchy
  ListHierarchy: common/ListHierarchy
  SwitchView: common/SwitchView
  # parts of the hierarchies: cells (tableCell), rows (hierarchyRow), header controls (hierarchyHeader)
  TextInfoCell: common/TextInfoCell
  TableCapabilityCell: common/TableCapabilityCell
  ListSupportedToolsRow: common/ListSupportedToolsRow
  ListToolsControls: common/ListToolsControls
  ProxyConnectionDiagram: common/ProxyConnectionDiagram
  # compatibility tag names, kept so existing documents still render
  DocFileTree: common/FileTree
  DocIndex: common/Index
  DocMultiLang: common/MultiLang
  DocImage: common/Image
  DocImageGrid: common/ImageGrid
  DocDiagramText: common/DiagramText
  DocDiagramMermaid: common/DiagramMermaid
  DocDiagramER: common/DiagramER
  # built-in name of the fragment id declaration before a heading or another node:
  # <!--renderComp=Anchor,id=configuration-->
  Anchor: common/Anchor
  # built-in name of a tag mentioned in document text: <Tag tagId="guide" />
  Tag: common/Tag
  # built-in name of the default tag look, used by tag definitions
  TagLabel: common/TagLabel
  # built-in name of the tag overview (popup content and document component)
  TagOverview: common/TagOverview
  # built-in name of the side-panel item renderer. without this entry the page
  # uses common/SidePanelItem; the demo replaces it with a wrapper of it.
  SidePanelItem: specific/SidePanelItemDemo
  StockTable: specific/StockTable
  DemoCounter: specific/DemoCounter
  SourceLink: specific/SourceLink
  TagListAllDemo: specific/TagListAllDemo
  CompStateListDemo: specific/CompStateListDemo
  DocConfigDemo: specific/DocConfigDemo

# files referenced by Image / ImageGrid / DiagramMermaid properties, the
# binary files the source collects and the source files asset versions
# depend on are bundled into a build and exported as fileUrlByPath, which
# the doc page source service layer answers from (config.assetUrlGet of a component).
# design: doc_page_impl_source.md#files-in-a-build
collectComponentAttachmentsOnBuild: true

# display strategy for non-md files: suffix -> code block language
fileDisplay:
  py: python
  sh: bash
  yaml: yaml
