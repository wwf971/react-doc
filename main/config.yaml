# doc system config (example layer; local overrides go to config.0.yaml)

# the document this page shows: its entry file (xxx-entry.yaml), which
# declares the source rules, the tag definitions and the side panels of the
# document. "sidePanel" names one of its side panels instead of its default.
# design: doc_page_impl_side_panel.md#the-document-entry
docEntry:
  file: ../example_doc/example-entry.yaml
  # sidePanel: compact

# page values. when absent, the entry's "docEntry" mapping supplies them
# (title, homeDoc, homeItem), so another document deploys by changing
# docEntry.file alone; the demonstration leaves them to the entry.
# siteTitle: React Doc Test
# homeDoc: ~example/doc.md       # source path: ~{rootId}/relative/path (doc_page_impl_source.md)

# variables: ${name} in any string value of this file, of the entry's
# config declarations and of frontmatter "config" is replaced by the value
# here. design: doc_page_impl_config.md#variables
variable:
  # where Image / ImageGrid write a pasted image by default: a folder of
  # the source that the entry collects as "referenced" (example source.yaml)
  imageFileStoreDirDefault: ~example/asset-file/image

# the local asset store: versioned objects (text or binary) a component block
# can reference instead of carrying its data inline (```asset blocks). the
# file names the folders of the store and which one is the default; the
# settings panel of the page rewrites it. served through the asset api on
# the development server, bundled as a read-only snapshot into a build.
# design: doc_page_impl_asset.md
asset:
  file: ../example_doc/asset.yaml

# tag definitions of the page (how each tag looks), merged over the ones the
# entry and the documents it includes declare. which assets carry a tag is
# declared in source rules and side-panel nodes. the demonstration declares
# its definitions in the entry (tag.file); page-level entries would go here:
# tag:
#   defineById: { ... }
# design: doc_page_impl_tag.md

# page-level values of the config keys. keys of one feature share a prefix.
# document-level keys can be overridden per document by source rules,
# side-panel nodes and frontmatter "config". design: doc_page_impl_config.md
globalConfig:
  TagsDisplayAtMainPanelIsOn: true          # document level
  TagsDisplayAtSidePanelItemIsOn: true      # page level
  # page level. tag ids shown on side-panel items; remove the key to show all.
  # "test" is left out, so it shows next to the path bar but not in the side
  # panel. "file-ext" is the label added by the demo SidePanelItem renderer.
  TagsDisplayAtSidePanelItemsList: [part, guide, reference, code, draft, sub, file-ext]
  TagsDisplayAtLinkIsOn: false              # document level
  TagsDisplayAtLinkPosition: after          # document level: before | after
  TagsOverviewPopupIsOn: true               # page level
  # page level, default false: a tag on a side-panel item opens the overview
  # too. on here so the demo can show it; off, a click on the item navigates
  TagsOverviewPopupAtSidePanelItemIsOn: true

# component-level config: the keys a registered component declares for
# itself (compDefine configDefineList), set by the component's tag name.
# overridden per document the same way as document-level keys, under a
# "compConfig" mapping of a source rule, a side-panel node or frontmatter
# "config"; the settings panel shows them on its Component tab.
# design: doc_page_impl_config.md#component-level-config
compConfig:
  Image:
    FileStoreDir: ${imageFileStoreDirDefault}   # the folder a pasted image is written to
    PasteReplaceConfirmIsOn: true               # ask before a paste replaces an existing image
  ImageGrid:
    FileStoreDir: ${imageFileStoreDirDefault}
    PasteReplaceConfirmIsOn: true

# tag name usable in docs -> component id in comp-doc/registry/registry.js
compRegistry:
  Tabs: common/Tabs
  Tab: common/Tab
  Callout: common/Callout
  Accordions: common/Accordions
  Accordion: common/Accordion
  Steps: common/Steps
  Step: common/Step
  Files: common/Files
  File: common/File
  Folder: common/Folder
  FileTree: common/FileTree
  Index: common/Index
  DocLinkInline: common/DocLinkInline
  MultiLang: common/MultiLang
  Image: common/Image
  ImageGrid: common/ImageGrid
  DiagramText: common/DiagramText
  DiagramMermaid: common/DiagramMermaid
  Block: common/Block
  BlockSimple: common/BlockSimple
  BlockMdx: common/BlockMdx
  # compatibility tag names, kept so existing documents still render
  DocFileTree: common/FileTree
  DocIndex: common/Index
  DocMultiLang: common/MultiLang
  DocImage: common/Image
  DocImageGrid: common/ImageGrid
  DocDiagramText: common/DiagramText
  DocDiagramMermaid: common/DiagramMermaid
  # built-in name of the fragment id declaration before a heading or another node:
  # <!--renderComp=Anchor,id=configuration-->
  Anchor: common/Anchor
  # built-in name of a tag mentioned in document text: <Tag tagId="guide" />
  Tag: common/Tag
  # built-in name of the default tag look, used by tag definitions
  TagLabel: common/TagLabel
  # built-in name of the tag overview (popup content and document component)
  TagOverview: common/TagOverview
  # built-in name of the side-panel item renderer. without this entry the page
  # uses common/SidePanelItem; the demo replaces it with a wrapper of it.
  SidePanelItem: specific/SidePanelItemDemo
  StockTable: specific/StockTable
  DemoCounter: specific/DemoCounter
  SourceLink: specific/SourceLink
  TagListAllDemo: specific/TagListAllDemo
  DocConfigDemo: specific/DocConfigDemo

# files referenced by Image / ImageGrid / DiagramMermaid properties, the
# binary files the source collects and the source files asset versions
# depend on are bundled into a build and exported as fileUrlByPath, which
# the source layer answers from (config.assetUrlGet of a component).
# design: doc_page_impl_source.md#files-in-a-build
collectComponentAttachmentsOnBuild: true

# display strategy for non-md files: suffix -> code block language
fileDisplay:
  py: python
  sh: bash
  yaml: yaml
