# The default keyboard map of the doc page package: the default keys of the
# built-in apis, named by config.yaml (hotkey.file), the lowest map of the
# stack. The maps of the doc pages (.doc-page/hotkey/), the workspace's map
# (workspace.yaml hotkey.file) and the host's are stacked over it, so any of
# them rebinds or unbinds a key here. The keys follow the editors readers
# know (the palette as in VS Code) and avoid the keys browsers keep for
# themselves; "mod" is Cmd on macOS and Ctrl elsewhere. The grammar is the
# one of every map file. design: doc_page_impl_api_hotkey.md
hotkeyMap:
  description: the default keys of the doc page package
  bindingList:
    - key: mod+shift+p
      api: palette/toggle
      description: the command palette
    - key: f1
      api: palette/toggle
      description: the command palette
    - key: alt+left
      api: nav/back
    - key: alt+right
      api: nav/forward
    - key: alt+up
      api: nav/up
    - key: alt+home
      api: nav/home
    - key: mod+shift+e
      api: edit/modeToggle
      when: editAvailable
    - key: mod+shift+b
      api: edit/blockSelectModeToggle
      when: editAvailable
    # undo and redo (doc_page_impl_edit_history.md): the document, or the
    # component, the author is at; inside a text being typed (a field, the
    # source of a block) the keys stay the text's own, the browser's undo
    - key: mod+z
      api: history/undo
      when: editBody && !textFocused
    - key: mod+shift+z
      api: history/redo
      when: editBody && !textFocused
    - key: ctrl+y
      api: history/redo
      when: editBody && !textFocused
    - key: mod+,
      api: settings/toggle
    - key: mod+f
      api: find/open
      when: findScopeActive
      description: find in the part of the page under the pointer (a diagram); elsewhere the browser's find
    - key: escape
      api: find/close
      when: findOpen
      description: close the search of that part
    # structural edit (doc_page_impl_edit_structure.md#the-keys-of-the-selection):
    # the keys of the block or list item selected in edit mode (Shift + click),
    # taken only while something is selected. they stand after the keys above,
    # so while a selection exists alt+up moves it instead of navigating
    - key: escape
      api: edit/selectClear
      when: structSelected
      description: close what is open on the selection, else end the selection
    - key: enter
      api: edit/selectionEnter
      when: structSelected
      description: edit the content of the selected block or list item
    - key: tab
      api: doc/itemIndent
      when: structItemSelected
      description: the selected list item one level deeper
    - key: shift+tab
      api: doc/itemOutdent
      when: structItemSelected
      description: the selected list item one level up
    - key: alt+up
      api: edit/selectionMove
      params: { direction: up }
      when: structSelected
    - key: alt+down
      api: edit/selectionMove
      params: { direction: down }
      when: structSelected
    - key: delete
      api: edit/selectionDeleteAsk
      when: structSelected
    - key: backspace
      api: edit/selectionDeleteAsk
      when: structSelected
