# The doc page of the package "{{name}}", created by `react-doc init package`:
# it lets the package be read and launched (react-doc dev <its folder>), or
# listed in a workspace, beside being imported. A package treated as a doc page
# is read-only: nothing of the page writes into its folder. Its components and
# templates are read from comp-mdx/ and service-template-*/ at its top.
# design: main/doc_page_impl_package.md#a-package-as-a-doc-page
docEntry:
  title: {{title}}
  homeDoc: ~{{name}}/doc/README.md
source:
  file: ./source.yaml
sidePanelById:
  main:
    file: ./side-panel.yaml
