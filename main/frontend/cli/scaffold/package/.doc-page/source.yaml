# The documents of the package are in doc/. The root is the package folder, so
# that .doc-page/asset is named by it; comp-mdx/ and the template folders of a
# package are never collected.
rules:
  - action: addFolder
    alias: {{name}}
    path: ..
    collect: recursive
    exclude:
      - doc-package.yaml
      - package.json
      - .gitignore
      - .DS_Store
