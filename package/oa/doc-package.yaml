# The config of the package "oa", created by `react-doc init package`.
# Its name and place are fixed: doc-package.yaml at the root of the package.
# Every key is required; the folders of a package have fixed names
# (comp-mdx/, service-template-app/, service-template-infra/, doc/README.md).
# design: main/doc_page_impl_package.md
name: oa
description: >-
  Office automation: components for what an office keeps track of (a Zoom
  meeting, an online course, a weekly timetable holding them), each a block of
  a document and a card a card diagram can hold; times kept one way, with the
  preferences of the package (12 or 24 hours, the first day of a week).
# the packages this one needs: { dir }, relative to this file
packageDependList:
  # the card diagrams of its documents (a meeting held by a card)
  - { dir: ../cloud-dev-vis }
