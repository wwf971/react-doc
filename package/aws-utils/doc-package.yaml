# The config of the package "aws-utils". Its name and place are fixed: doc-package.yaml at the
# root of the package. Every key is required; the folders of a package have fixed names
# (comp-mdx/, service-template-app/, service-template-infra/, doc/README.md).
# design: main/doc_page_impl_package.md
name: aws-utils
description: "AWS behind a doc page: a storage type keeping partitions of frontend objects at a storage service, and an auth provider signing people in with Amazon Cognito"
# the packages this one needs: { dir }, relative to this file
# cloud-dev-vis: the diagrams of the storage service (doc/storage-architecture.md)
packageDependList:
  - { dir: ../cloud-dev-vis }
