# The Power Platform series (doc/power-platform.md): Dataverse tables and
# global choices, Power Automate steps and business rules, as node kinds of
# the card diagram of the base series (../card-diagram). Every diagram
# component of the series draws with one node registry
# (power-platform-node-registry.js); DiagramDataverseEntity shows one
# Dataverse table card outside a canvas.
compList:
  - tagName: DiagramER
    entry: ./power-platform-comp.js
    dependencyCollect: { entry: ../card-diagram/DiagramERSource.js, export: diagramDependenciesCollect }
  - tagName: DiagramPowerAutomate
    entry: ./power-platform-comp.js
    dependencyCollect: { entry: ../card-diagram/DiagramERSource.js, export: diagramDependenciesCollect }
  - tagName: DiagramBusinessRule
    entry: ./power-platform-comp.js
    dependencyCollect: { entry: ../card-diagram/DiagramERSource.js, export: diagramDependenciesCollect }
  - tagName: DiagramERAnimation
    entry: ./power-platform-comp.js
    dependencyCollect: { entry: ../card-diagram-animation/AnimationSource.js, export: animationDependenciesCollect }
  - tagName: DiagramERSwitch
    entry: ./power-platform-comp.js
    dependencyCollect: { entry: ../card-diagram-switch/SwitchSource.js, export: switchDependenciesCollect }
  - tagName: DiagramDataverseEntity
    entry: ./power-platform-comp.js
  # a database migration as a frontend object (doc/power-platform-migration.md): the
  # modes its type names, never written as blocks themselves
  - tagName: MigrationExplorer
    entry: ./migration/migration-comp.js
    export: MigrationExplorerDefine
  - tagName: MigrationSchemaTableEdit
    entry: ./migration/migration-comp.js
    export: MigrationSchemaTableEditDefine
  - tagName: MigrationSchemaChoiceEdit
    entry: ./migration/migration-comp.js
    export: MigrationSchemaChoiceEditDefine
  - tagName: MigrationMappingTableEdit
    entry: ./migration/migration-comp.js
    export: MigrationMappingTableEditDefine
  - tagName: MigrationMappingColumnEdit
    entry: ./migration/migration-comp.js
    export: MigrationMappingColumnEditDefine
  - tagName: MigrationMappingChoiceEdit
    entry: ./migration/migration-comp.js
    export: MigrationMappingChoiceEditDefine
  - tagName: MigrationItemList
    entry: ./migration/migration-comp.js
    export: MigrationItemListDefine
  - tagName: MigrationTour
    entry: ./migration/migration-comp.js
    export: MigrationTourDefine
