# The documents of the package are in doc/; the root is the package folder, as
# a doc page's is, so that .doc-page/asset is named by it. comp-mdx/ and the
# template folders of a package are never collected.
rules:
  - action: addFolder
    alias: cloud-dev-vis
    path: ..
    collect: recursive
    exclude:
      - doc-package.yaml
      - package.json
      - .gitignore
      - .DS_Store
