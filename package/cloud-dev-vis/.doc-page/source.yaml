# The design documents of the package are in doc/, the document of a component
# in its folder of comp-mdx/; the root is the package folder, as a doc page's is,
# so that .doc-page/asset is named by it. Of comp-mdx/ only the Markdown documents
# are collected, never the code; the template folders of a package never are.
rules:
  - action: addFolder
    alias: cloud-dev-vis
    path: ..
    collect: recursive
    exclude:
      - doc-package.yaml
      - package.json
      - .gitignore
      - .DS_Store
