# The side panel of the package's doc page: the documents demonstrating its
# components first, its design documents below.
sidePanelById:
  main:
    tree:
      - id: cloud-dev-vis
        text: cloud-dev-vis
        doc: ~cloud-dev-vis/doc/README.md
        defaultOpen: true
        children:
          - doc: ~cloud-dev-vis/doc/comp-diagram-er.md
          - doc: ~cloud-dev-vis/doc/comp-powerplatform.md
          - doc: ~cloud-dev-vis/doc/comp-card-diagram-animation.md
          - id: design
            text: Design
            defaultOpen: false
            children:
              - doc: ~cloud-dev-vis/doc/card-diagram.md
              - doc: ~cloud-dev-vis/doc/card-diagram-impl.md
              - doc: ~cloud-dev-vis/doc/card-diagram-animation.md
              - doc: ~cloud-dev-vis/doc/power-platform.md
